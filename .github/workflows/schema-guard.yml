name: Schema guard

# Catches the PGRST203 exposed-RPC-overload class of bug against the live
# Namera schema. Reuses the workflow published in siddmax/yurivan.
on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/schema-guard.yml"
  workflow_dispatch:

concurrency:
  group: schema-guard-production
  cancel-in-progress: false

jobs:
  guard:
    uses: siddmax/yurivan/.github/workflows/schema-guard.reusable.yml@main
    with:
      schema: namera
      project-ref: wmnzjmrysnzjthldgffh
    secrets:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

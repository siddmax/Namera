name: Schema guard

# Catches the PGRST203 exposed-RPC-overload class of bug against the live
# Namera schema. Reuses the workflow published in siddmax/yurivan.
on:
  push:
    branches: [master]
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/schema-guard.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: schema-guard-production
  cancel-in-progress: false

jobs:
  guard:
    uses: siddmax/yurivan/.github/workflows/schema-guard.reusable.yml@cc481a93e949e9dd2e2662ff927038467f3336f7
    with:
      schema: namera
      project-ref: wmnzjmrysnzjthldgffh
    secrets:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
